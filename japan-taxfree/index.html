<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="退稅小幫手">
<title>日本退稅小幫手</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#FFFFFF; --surface:#F7F5F2; --line:#E8E3DE;
  --ink:#2E2A27; --ink2:#57504A; --ink3:#6B635C;
  --blue:#46576B; --blue-bg:#E4E9EF; --blue-mid:#7D8DA0; --btn:#C9D4E0; --btn-h:#BCC8D6; --btn-down:#AEBCCB; --btn-ink:#24303C;
  --sand:#6A5535; --sand-bg:#F1E8DA; --sand-mid:#B08F5E;
  --rose:#8E4F4B; --rose-bg:#F5E6E4; --rose-mid:#E2B9B5;
  --ok:#3E5A78; --ok-bg:#E5ECF3; --ok-mid:#9DB0C6;
  --warn:#8B4639; --warn-bg:#F6E6E1; --warn-mid:#D9A79C;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(46,42,39,.05),0 4px 14px rgba(46,42,39,.07);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
header.top{padding:calc(14px + env(safe-area-inset-top)) 2px 8px;display:flex;align-items:center;gap:8px;color:var(--blue)}
header.top h1{font-size:20px;margin:0;font-weight:800;color:var(--ink)}
.view{display:none;animation:fadeUp .35s var(--ease)}
.view.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
h2{font-size:18px;margin:22px 2px 10px;font-weight:700}
.muted{color:var(--ink3)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ico{display:grid;place-items:center;flex:none}
.wrap-pretty{text-wrap:pretty}

/* info blocks: flat, no shadow */
.card{background:var(--surface);border:none;border-radius:var(--r);padding:14px 16px;box-shadow:none}

/* buttons: tappable = shadow or fill; feedback = color only */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:10px 18px;min-height:52px;font-weight:700;font-size:16px;transition:background .15s,box-shadow .15s,color .15s}
.btn.pri{background:var(--btn);color:var(--btn-ink);box-shadow:0 2px 8px rgba(70,87,107,.16)}
.btn.pri:hover{background:var(--btn-h)} .btn.pri:active{background:var(--btn-down)}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.sec:active{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost{background:none;color:var(--warn);font-weight:700;box-shadow:none}
.btn.ghost:active{background:var(--warn-bg)}
.btn.text{background:none;color:var(--blue);font-weight:700;box-shadow:none;padding:0 6px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.btn.text:active{background:var(--blue-bg)}
.btn.block{width:100%}
.btn:disabled{background:transparent;color:#6E6862;border:1px dashed #C9C2BA;box-shadow:none;cursor:not-allowed}
.btn.sm{min-height:44px;padding:6px 14px;font-size:14px;border-radius:12px}

/* summary */
.summary{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.summary .lbl{font-size:14px;color:var(--ink2)}
.big{font-size:44px;font-weight:800;letter-spacing:-.01em;line-height:1.1;margin:4px 0 0}
.big small{font-size:22px;font-weight:700;margin-right:2px}
.twd{font-size:15px;color:var(--ink2);font-weight:600;min-height:1em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px}
.stat{text-align:center;border-left:1px solid var(--line);padding:2px 4px}
.stat:first-child{border-left:none}
.stat b{display:block;font-size:20px;line-height:1.3;font-weight:700}
.stat span{font-size:12px;color:var(--ink3)}

/* airport hero */
.hero{margin-top:10px;width:100%;border:none;border-radius:20px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:76px;text-align:left;box-shadow:0 6px 18px rgba(70,87,107,.18);transition:background .15s}
.hero:hover{background:var(--btn-h)} .hero:active{background:var(--btn-down)}
.hero .ico{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.6)}
.hero b{display:block;font-size:20px;line-height:1.25;font-weight:800}
.hero span{font-size:14px;font-weight:600;color:#33414F}
.hero .go{margin-left:auto}

/* add buttons */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
#v-home h2{margin-top:16px}

/* countdown: one line */
.cd{margin-top:14px;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px}
.cd-main{flex:1;min-width:0}
.cd-line{font-weight:700;font-size:16px;line-height:1.35}
.cd-line .n{font-size:22px;font-weight:800;color:var(--blue);margin-right:2px}
.cd-date{display:inline-flex;align-items:center;min-height:44px;padding:0;border:none;background:none;color:var(--blue);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.cd-date:active{background:var(--blue-bg)}
.cd-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:56px;min-height:52px;padding:4px 8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-size:12px;font-weight:700;color:var(--ink2);box-shadow:var(--shadow);transition:background .15s}
.cd-btn:active{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.cd-btn[aria-pressed=true]{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-mid)}
.cd-note{font-size:13px;color:var(--ink3);margin:6px 2px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* chips & list */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 16px;font-size:14px;min-height:44px;transition:background .15s,color .15s}
.chip:active{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed=true]{background:var(--blue-bg);border-color:var(--blue-mid);color:var(--blue);font-weight:700}
.list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.rc{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);transition:background .15s;animation:fadeUp .3s var(--ease) both}
.rc:active{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.rc-top{display:flex;gap:12px;align-items:center}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--surface);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--ink3)}
.thumb img{width:100%;height:100%;object-fit:cover}
.rc-main{flex:1;min-width:0}
.rc-name,.apr-name b{font-weight:700;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.rc-meta{font-size:13px;color:var(--ink3)}
.rc-amt{text-align:right;flex:none}
.rc-amt b{display:block;font-weight:700}
.rc-amt span{font-size:12px;color:var(--ink3)}
.rc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:8px;font-weight:700}
.tag.c{background:var(--sand-bg);color:var(--sand)} .tag.w{background:var(--warn-bg);color:var(--warn)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.chev{color:var(--ink3);flex:none}
.empty{text-align:center;padding:20px 16px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--ink2)}

/* tabbar */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink3);min-height:60px;position:relative;transition:color .15s}
.tab:active{color:var(--blue)}
.tab[aria-selected=true]{color:var(--blue);font-weight:700}
.tab[aria-selected=true]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--rose-mid)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:14px;padding:3px;position:relative}
.seg button{border:none;background:none;border-radius:11px;padding:6px 0;min-height:44px;font-weight:700;color:var(--ink2);position:relative;z-index:1;transition:color .2s}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;border-radius:11px;background:var(--bg);box-shadow:0 1px 4px rgba(46,42,39,.14);transition:transform .28s var(--ease)}

/* calculator */
.calc-top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.target{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink3)}
.target select{flex:1;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:0 12px;background:var(--bg);font-weight:700;min-width:0;color:var(--ink);box-shadow:var(--shadow)}
.disp{margin-top:8px;background:var(--surface);border-radius:var(--r);padding:6px 14px}
.disp-in{display:flex;align-items:baseline;justify-content:space-between;gap:4px;font-size:36px;font-weight:800;line-height:1.2}
.disp-in .lbl{font-size:13px;font-weight:500;color:var(--ink3);align-self:center}
.disp-in small{font-size:18px;color:var(--ink3);margin-right:2px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.res > div{border-radius:var(--r-sm);padding:6px 12px}
.res > div:first-child{background:var(--blue-bg)}
.res > div:last-child{background:var(--surface)}
.res span{font-size:12px;font-weight:700;color:var(--blue)}
.res > div:last-child span{color:var(--ink2)}
.res b{display:block;font-size:22px;line-height:1.25;font-weight:800}
.fx{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink3);min-height:44px}
.fx-edit{display:flex;gap:8px;margin-bottom:6px}
.fx-edit input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:0}
.ringbox{display:flex;align-items:center;gap:12px;padding:6px 2px}
.ring{width:60px;height:60px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:#ECE9E5}
.ring .base{stroke:var(--blue-mid);transition:stroke-dashoffset .8s var(--ease)}
.ring .add{stroke:var(--sand-mid);transition:stroke-dashoffset .8s var(--ease)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}
.ring-txt{flex:1;min-width:0}
.ring-txt b{display:block;font-size:17px;line-height:1.35}
.dot-l{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--c);margin-right:4px;vertical-align:1px}
.legend{font-size:13px;color:var(--ink2)}
.legend span+span{margin-left:10px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.key{min-height:50px;border:none;border-radius:14px;background:var(--surface);font-size:24px;font-weight:600;transition:background .12s;color:var(--ink)}
.key:active{background:var(--btn)}
.key.fn{font-size:16px;color:var(--ink2)}

/* packing */
.pk-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk-box{border-radius:var(--r);padding:10px;text-align:center}
.pk-box b{display:block;font-size:36px;font-weight:800;line-height:1.1}
.pk-box span{font-weight:700;font-size:14px}
.pk-box.carry{background:var(--blue-bg);color:var(--blue)} .pk-box.check{background:var(--sand-bg);color:var(--sand)}
.pk-group{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.pk-group h3{font-size:14px;color:var(--ink3);margin:8px 0 0;font-weight:700}
.pk{border-top:1px solid var(--line);padding:10px 0;transition:background .2s}
.pk:first-of-type{border-top:none}
.pk.bad{background:#FCF9F4;margin:0 -14px;padding:10px 14px}
.pk-row{display:flex;align-items:center;gap:10px}
.pk-name{flex:1;min-width:0;font-weight:700;line-height:1.35}
.pk-meta{flex:1;min-width:0;font-size:12px;color:var(--ink3)}
.pk .seg{width:140px;flex:none}
.pk .seg button{font-size:14px}
.pk-row2{display:flex;align-items:center;gap:10px;margin-top:2px}
.tog{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 12px;min-height:44px;font-size:13px;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s;flex:none}
.tog:active{background:var(--surface)}
.tog[aria-pressed=true]{background:var(--blue-bg);border-color:var(--blue-mid);color:var(--blue)}
.pk-warn{margin-top:6px;padding-top:4px;border-top:1px dashed var(--warn-mid);color:var(--warn);font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;animation:pop .3s var(--ease)}
.pk-warn span{flex:1;text-wrap:pretty}
.pk-warn .btn.ghost{min-height:44px;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.pk-tip{margin-top:4px;color:var(--ink3);font-size:13px;animation:pop .3s var(--ease)}
.pk-gone{font-size:13px;color:var(--warn);padding:8px 0;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}

/* guide: flat list */
.rules{border-top:1px solid var(--line)}
.rule{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.rule .n{width:28px;height:28px;border-radius:99px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center;font-size:14px;font-weight:700}
.rule.hot .n{background:var(--rose-bg);color:var(--rose)}
.rule b{font-size:16px;display:block;line-height:1.4}
.rule p{margin:2px 0 0;font-size:14px;color:var(--ink2)}
.lnks{display:flex;flex-wrap:wrap;column-gap:14px}
a.lnk{color:var(--blue);font-weight:700;font-size:13px;text-underline-offset:3px;display:inline-flex;min-height:44px;align-items:center}
a.lnk:active{background:var(--blue-bg)}

/* editor */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .38s var(--ease),visibility 0s .38s;visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition:transform .38s var(--ease)}
.sheet .in{max-width:480px;margin:0 auto;padding:0 16px calc(190px + env(safe-area-inset-bottom))}
.sheet-head{position:sticky;top:0;background:#FFFFFF;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px 8px;border-bottom:1px solid var(--line);margin:0 -16px}
.sheet-head h3{margin:0;font-size:17px;flex:1}
.back{background:none;border:none;display:flex;align-items:center;gap:2px;color:var(--blue);font-weight:700;padding:8px;min-height:44px;border-radius:10px}
.back:active{background:var(--surface)}
.ocr-btns{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-top:14px}
.ocr-btns .btn{min-height:56px}
.ocr-bar{margin-top:12px;border-radius:var(--r);padding:12px 14px;background:var(--sand-bg);color:var(--sand);font-size:14px;animation:pop .3s var(--ease)}
.ocr-bar b{display:block;font-size:15px}
.ocr-bar .track{margin-top:8px;background:rgba(255,255,255,.7);height:8px;border-radius:99px;overflow:hidden}
.ocr-bar .fill{height:100%;background:var(--sand-mid);transition:width .3s}
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:14px;color:var(--ink2);margin-bottom:6px;font-weight:700}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:48px;background:var(--bg);transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--blue-mid);box-shadow:0 0 0 3px var(--blue-bg)}
.inp.auto{border-color:var(--sand-mid);background:#FCF8F1}
.autotag{font-size:12px;font-weight:700;font-style:normal;color:var(--sand);background:var(--sand-bg);padding:2px 6px;border-radius:6px;margin-left:6px}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.row2 .field:last-child .inp{max-width:220px}
.photo-prev{margin-top:10px;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.photo-prev img{display:block;width:100%;max-height:220px;object-fit:contain;background:var(--surface)}
.photo-prev .rm{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-size:13px;font-weight:700;min-height:44px;color:var(--warn)}
.photo-prev .rm:active{background:var(--warn-bg)}
.items{display:grid;gap:12px;margin-top:8px;grid-template-columns:minmax(0,1fr)}
.item{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg);animation:fadeUp .3s var(--ease)}
.item.is-c{border-color:var(--sand-mid)}
.item.is-gone{border-color:var(--warn-mid)}
.item-head{display:flex;gap:8px;align-items:center}
.item-head .inp{flex:1;min-width:0}
.x{flex:none;width:44px;height:44px;border-radius:12px;border:none;background:var(--surface);display:grid;place-items:center;color:var(--ink2);transition:background .15s}
.x:active{background:var(--line)}
.item-grid{display:grid;grid-template-columns:136px 1fr;gap:10px;margin-top:10px;align-items:end}
.mini{font-size:12px;color:var(--ink3);display:block;margin-bottom:4px;font-weight:700}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;height:48px;overflow:hidden}
.stepper button{width:44px;height:100%;border:none;background:var(--surface);font-size:20px;transition:background .12s}
.stepper button:active{background:var(--btn)}
.stepper output{flex:1;text-align:center;font-weight:700}
.item .tog{margin-top:10px}
.dont{display:none;margin-top:4px;padding:6px 0;color:var(--sand);font-size:14px;gap:6px;align-items:center;font-weight:700}
.item.is-c .dont{display:flex;animation:pop .3s var(--ease)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin:0}
.food{display:none} .item.is-c .food{display:flex}
.gone-warn{display:none;padding:2px 0 4px;color:var(--warn);font-size:14px;font-weight:700;gap:6px;align-items:center}
.item.is-gone .gone-warn{display:flex;animation:pop .3s var(--ease)}
.add-item{margin-top:12px;width:100%;border:1.5px dashed var(--blue-mid);background:var(--bg);color:var(--blue);border-radius:var(--r);min-height:52px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.add-item:active{background:var(--blue-bg)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:55;background:#FFFFFF;border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom));transform:translateY(110%);visibility:hidden;transition:transform .38s var(--ease),visibility 0s .38s}
.sheet.on ~ .dock{transform:none;visibility:visible;transition:transform .38s var(--ease)}
.dock .in2{max-width:448px;margin:0 auto}
.dock .sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--ink2)}
.dock .sum b{font-size:20px;color:var(--ink)}

.mp-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.mp-map{height:340px;width:100%;background:#EEEAE5}
.mp-st{position:absolute;left:10px;right:10px;bottom:10px;z-index:500;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:14px}
.mp-st span{font-size:12px;color:var(--ink3)}
.mp-st.err,.mp-st.off{border-color:var(--rose-mid);background:var(--rose-bg)}
.mp-st.err b,.mp-st.off b{color:var(--rose)}
.mp-st.none{background:var(--sand-bg);border-color:#E3D3B9}
.mp-st.inline{position:static;margin-top:10px;flex-direction:row;align-items:center}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--blue-bg);border-top-color:var(--blue);animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.mp-pin{display:flex!important;align-items:center;justify-content:center;background:transparent;border:0}
.mp-pin span{display:block;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 3px rgba(46,42,39,.35)}
.mp-pin.tax span{width:22px;height:22px;border:3px solid #2E2A27}
.mp-pin.sel span{width:26px;height:26px;border:3px solid #2E2A27;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 1px 4px rgba(46,42,39,.4)}
.mp-me{background:transparent;border:0}
.mp-me span{display:block;width:16px;height:16px;margin:4px;border-radius:50%;background:#46576B;border:3px solid #fff;box-shadow:0 0 0 6px rgba(70,87,107,.22)}
.leaflet-control-zoom a{width:44px!important;height:44px!important;line-height:44px!important;font-size:22px!important;color:var(--ink)!important}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:11px}
.mp-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 10px 8px 12px;margin-top:8px;min-height:56px;box-shadow:var(--shadow);transition:background .15s}
.mp-row:active{background:var(--surface)}
.mp-row .n{flex:1;min-width:0}
.mp-row .n b{display:block;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.mp-row .n span{display:block;font-size:12px;color:var(--ink3);line-height:1.4;overflow-wrap:anywhere}
.mp-row .chev{color:var(--ink3);display:flex}
.mp-row em.ok,.mp-ok{font-style:normal;color:var(--ok);font-weight:800}
.mp-ok,.mp-maybe{margin-top:10px;font-size:14px;border-radius:10px;padding:8px 10px;font-weight:700}
.mp-ok{background:var(--ok-bg)}
.mp-maybe{background:var(--sand-bg);color:var(--sand)}
.mp-card{border:1px solid var(--blue-mid);background:#fff}
.mp-card .btn svg{width:18px;height:18px;margin-right:4px}
.mp-osm{display:inline-flex;align-items:center;min-height:44px;font-size:13px;color:var(--blue);font-weight:700}
.mp-off{display:grid;gap:8px}
.mp-off .btn{justify-content:flex-start;text-align:left;font-size:14px}
.mp-src{font-size:12px;color:var(--ink3);line-height:1.6;margin:10px 0 0}
.mp-src a{color:var(--blue);font-weight:700;display:inline-flex;align-items:center;min-height:44px}
.fx-now{background:var(--surface);border-radius:var(--r);padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:2px}
.fx-now span{font-size:13px;color:var(--ink3)}
.fx-now b{font-size:24px;font-weight:900}
.fx-verdict{margin-top:8px;font-weight:800;font-size:15px;border-radius:10px;padding:8px 10px;background:#ECE9E5;color:var(--ink2)}
.fx-verdict.good{background:var(--blue-bg);color:var(--blue)}
.fx-verdict.bad{background:var(--rose-bg);color:var(--rose)}
.fx-chart{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:6px;background:#fff}
.fx-svg{display:block;width:100%;height:auto}
.fx-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink3);margin-top:6px}
.fx-leg span{display:inline-flex;align-items:center;gap:4px}
.fx-leg i{display:inline-block;width:16px;height:3px;border-radius:2px}
.fx-leg i.dash{height:0;border-top:2px dashed;background:none}
.fx-leg i.c{width:9px;height:9px;border-radius:50%}
.sp-hero{background:var(--surface);border-radius:var(--r);padding:16px;margin-top:4px;display:flex;flex-direction:column;gap:2px}
.sp-hero span{font-size:13px;color:var(--ink3);line-height:1.5}
.sp-hero b{font-size:40px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
.sp-real{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0;padding:8px 0!important}
.sp-real b{font-size:18px}
.sp-stack{display:flex;height:18px;border-radius:99px;overflow:hidden;background:#ECE9E5}
.sp-stack i{display:block;height:100%}
.sp-leg{margin-top:8px}
.sp-leg div{display:grid;grid-template-columns:14px 1fr auto 44px;gap:8px;align-items:center;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.sp-leg div i{width:12px;height:12px;border-radius:4px}
.sp-leg em{font-style:normal;color:var(--ink3);text-align:right;font-weight:700}
.sp-day{display:grid;grid-template-columns:48px 1fr 92px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.sp-day b{text-align:right}
.sp-b{height:10px;background:#ECE9E5;border-radius:99px;overflow:hidden}
.sp-b i{display:block;height:100%;background:var(--blue-mid);border-radius:99px}
.sp-li{display:grid;grid-template-columns:10px 1fr auto 44px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sp-li>i{width:10px;height:10px;border-radius:50%}
.sp-li .n{min-width:0}
.sp-li .n b{display:block;font-size:15px;overflow-wrap:anywhere}
.sp-li .n span{display:block;font-size:12px;color:var(--ink3)}
.sp-cur button{min-height:44px}
.btn svg{flex:none}
</style>
</head>
<body>
<div class="app">

      <button class="tool" data-tool="time"><span class="ico" data-ic="clock"></span><span><b>搭機時間倒推</b><span class="s">幾點出門才來得及</span></span></button>
      <button class="tool" data-tool="cv"><span class="ico" data-ic="doc"></span><span><b>給海關看</b><span class="s">日文大字清單</span></span></button>
      <button class="tool" data-tool="share"><span class="ico" data-ic="share"></span><span><b>旅伴共用</b><span class="s">用連結或 QR 分享</span></span></button>
      <button class="tool" data-tool="shop"><span class="ico" data-ic="bagx"></span><span><b>藥妝必買試算</b><span class="s">算可退、差多少到門檻</span></span></button>
      <button class="tool" data-tool="fx"><span class="ico" data-ic="fx"></span><span><b>匯率走勢</b><span class="s">30／90 天、目標提醒</span></span></button>
      <button class="tool" data-tool="spend"><span class="ico" data-ic="wallet"></span><span><b>旅行花費總表</b><span class="s">總花費、分類、每天、匯出 CSV</span></span></button>
    </div>
  </section>

  <!-- CALC -->
  <section class="view" id="v-calc" role="tabpanel" aria-labelledby="tab-calc">
    <div class="target"><span data-ic="receipt" aria-hidden="true"></span><select id="cTarget" aria-label="比對收據"></select></div>
    <div class="calc-top">
      <div class="seg" id="segTax"><span class="knob"></span><button data-v="in" aria-pressed="true">含稅價</button><button data-v="ex" aria-pressed="false">未稅價</button></div>

    <button class="btn pri block" id="cAdd">加購</button>

/* ---------- money rules ---------- */
const rateOf=it=>(it.type==='c'&&it.food)?8:10;
const itemTax=it=>{const p=(+it.price||0)*(+it.qty||1),r=rateOf(it);return p*r/(100+r)};
const itemExcl=it=>(+it.price||0)*(+it.qty||1)-itemTax(it);
const rTotal=r=>r.items.reduce((s,it)=>s+(+it.price||0)*(+it.qty||1),0);
const rTax=r=>r.items.reduce((s,it)=>s+itemTax(it),0);
const rCount=r=>r.items.reduce((s,it)=>s+(+it.qty||1),0);
const rGone=r=>r.items.some(it=>it.gone);
const rHasC=r=>r.items.some(it=>it.type==='c');
const gkey=r=>(r.store||'').trim()+'|'+r.date+'|'+(r.owner||'');
const groupExcl=(k,skipId)=>S.receipts.filter(x=>gkey(x)===k&&x.id!==skipId).reduce((s,x)=>s+x.items.reduce((a,it)=>a+itemExcl(it),0),0);
function status(r){const w=[];if(rGone(r))w.push('少品項，整張不退');if(groupExcl(gkey(r))<5000)w.push('未滿 ¥5,000');if(S.dep&&r.date&&dayDiff(r.date,S.dep)>90)w.push('超過 90 天');return w}
const ok=r=>!status(r).length;
function totals(){let g=0,c=0,items=0;S.receipts.filter(r=>!r.owner).forEach(r=>{items+=rCount(r);if(!ok(r))return;r.items.forEach(it=>{const t=itemTax(it);it.type==='c'?c+=t:g+=t})});return{g,c,sum:g+c,items,warn:S.receipts.filter(r=>!r.owner&&!ok(r)).length}}
const twd=y=>S.fx&&S.fx.rate?'NT$'+Math.round(y*S.fx.rate).toLocaleString('zh-TW'):'';

function countUp(el,to,pre='',post=''){
  const from=+el.dataset.v||0;el.dataset.v=to;
  if(reduce||from===to){el.textContent=pre+fmt(to)+post;return}
  const t0=performance.now(),d=650;cancelAnimationFrame(el._raf);
  const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=pre+fmt(from+(to-from)*e)+post;if(k<1)el._raf=requestAnimationFrame(step)};
  el._raf=requestAnimationFrame(step);
}
function segSet(seg,val){const bs=[...seg.querySelectorAll('button')],i=bs.findIndex(b=>b.dataset.v===val||b.dataset.act===val);bs.forEach((b,j)=>b.setAttribute('aria-pressed',j===i));const k=seg.querySelector('.knob');k.style.width=`calc(${100/bs.length}% - ${6/bs.length}px)`;k.style.transform=`translateX(${i*100}%)`}

    ${(()=>{const st=r.st||'none',od=overdue(r),tg=(r.owner?`<span class="tag own">旅伴：${esc(r.owner)}</span>`:'')+(od?`<span class="tag w">${I.warn}該去問店家了</span>`:st==='paid'?`<span class="tag st2">已入帳</span>`:st==='conf'?`<span class="tag st1">已確認，等入帳</span>`:'')+(nc?`<span class="tag c">${I.lock}${nc} 件別用掉</span>`:'')+w.map(x=>`<span class="tag w">${I.warn}${x}</span>`).join('');return tg?`<div class="rc-tags">${tg}</div>`:''})()}</button>`}).join('');
  L.querySelectorAll('.rc').forEach(b=>b.onclick=()=>openEditor(b.dataset.id));

/* ---------- countdown & reminders ---------- */
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent),isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function renderCountdown(){
  const dep=S.dep;$('#depDate').value=dep||'';
  if(!dep){$('#cdLine').textContent='還沒設定出境日';$('#cdDate').textContent='設定出境日'}
  else{const n=dayDiff(today(),dep);
    $('#cdLine').innerHTML=n>0?`<span class="n num">${n}</span> 天後出境`:n===0?'今天出境':'出境日已過';
    $('#cdDate').textContent=md(dep);$('#cdDate').setAttribute('aria-label','改出境日：'+md(dep));}
  const can='Notification' in window,perm=can?Notification.permission:'unsupported',on=S.notify&&perm==='granted';
  $('#notifyLbl').textContent=on?'已開':'提醒';$('#btnNotify').setAttribute('aria-pressed',on);
  let note='';
  if(!can) note=isIOS&&!isStandalone?'iPhone 請先加入主畫面':'不支援通知，請用行事曆';
  else if(perm==='denied') note='通知已關，請用行事曆';
  else if(on) note='出境前一天和當天提醒';
  $('#cdNote').textContent=note;$('#cdNote').hidden=!note;
}
$('#btnNotify').onclick=async()=>{
  buzz();
  if(!S.dep){toast('先設定出境日');pickDate();return}
  if(!('Notification' in window)){renderCountdown();toast(isIOS&&!isStandalone?'分享 → 加入主畫面，從主畫面打開才收得到；最穩是加到行事曆':'這裡收不到通知，用行事曆吧');return}
  if(S.notify&&Notification.permission==='granted'){S.notify=false;save();renderCountdown();toast('提醒已關閉');return}
  const p=await Notification.requestPermission();
  if(p==='granted'){S.notify=true;save();syncSW();try{const reg=await navigator.serviceWorker?.ready;if(reg&&'periodicSync' in reg)await reg.periodicSync.register('jtf-remind',{minInterval:6*3600e3})}catch(e){}
    toast('提醒已開啟；App 沒開時不一定收得到，行事曆最可靠');checkRemind()}
  else toast('沒有開通知權限');
  renderCountdown();
};
async function notify(title,body){
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg){await reg.showNotification(title,{body,icon:'icon-192.png',tag:'jtf'});return true}}catch(e){}
  try{new Notification(title,{body,icon:'icon-192.png'});return true}catch(e){return false}
}
function remindMsg(n){return n===1?['明天出境','退稅品別先託運：到機場先過海關確認，再託運。']:['今天出境','先到退稅機器掃護照（託運前），所有退稅品帶在身上。']}
async function checkRemind(){
  if(!S.notify||!S.dep||!('Notification' in window)||Notification.permission!=='granted')return;
  const n=dayDiff(today(),S.dep);if(n!==1&&n!==0)return;
  const k=S.dep+':'+n;if(S.notified[k])return;
  const [t,b]=remindMsg(n);if(await notify(t,b)){S.notified[k]=1;save();try{const c=await caches.open('jtf-data');await c.put('./__jtf_sent_'+S.dep+'_'+n,new Response('1'))}catch(e){}}
}
async function syncSW(){try{const c=await caches.open('jtf-data');await c.put('./__jtf_dep',new Response(JSON.stringify({dep:S.dep,notify:S.notify})))}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderCountdown();checkRemind()}});
setInterval(checkRemind,15*60e3);

const icsEsc=s=>s.replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
function buildICS(dep){
  const c=s=>s.replace(/-/g,''),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const prev=c(addDays(dep,-1)),day=c(dep);
  const ev=(id,d,h,sum,desc)=>['BEGIN:VEVENT',`UID:${id}-${day}@jtf.local`,`DTSTAMP:${stamp}`,`DTSTART:${d}T${h}0000`,`DTEND:${d}T${h}3000`,`SUMMARY:${icsEsc(sum)}`,`DESCRIPTION:${icsEsc(desc)}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(sum)}`,'TRIGGER:-PT0M','END:VALARM','END:VEVENT'];
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//JTF//Tax Refund Helper//ZH-TW','CALSCALE:GREGORIAN',
    ...ev('eve',prev,'20','明天出境：退稅品別先託運','到機場先在託運前過海關退稅確認（掃護照），所有退稅品都要帶在身上。用掉的消耗品那張收據要跟海關櫃台說明。'),
    ...ev('day',day,'07','今天出境：先退稅確認再託運','提早到機場。到退稅機器（KIOSK）掃護照或用 Visit Japan Web，綠燈完成、紅燈去海關檢查處，之後才去報到託運。'),
    'END:VCALENDAR'].join('\r\n')+'\r\n';
}
$('#btnIcs').onclick=()=>{buzz();if(!S.dep){toast('先選出境日');$('#depDate').focus();return}
  const blob=new Blob([buildICS(S.dep)],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`出境提醒-${S.dep}.ics`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('已下載，打開就能加到行事曆')};

/* ---------- exchange rate ---------- */
async function loadFx(force){
  const fresh=S.fx&&S.fx.src==='api'&&Date.now()-S.fx.fetched<6*3600e3;
  if(S.fx&&S.fx.src==='manual'&&!force){renderFx();return}
  if(fresh&&!force){renderFx();return}
  try{const r=await fetch('https://open.er-api.com/v6/latest/JPY',{cache:'no-store'});const j=await r.json();
    if(j.result==='success'&&j.rates&&j.rates.TWD){S.fx={rate:j.rates.TWD,date:iso(new Date(j.time_last_update_unix*1000)),src:'api',fetched:Date.now()};save();try{fxLogPush(S.fx.date,S.fx.rate,'er');fxCheck(S.fx.rate,S.fx.date)}catch(_){}}}
  catch(e){}
  renderFx();renderHome();calcRender();
}

const C={val:'',tax:'in',rate:10,target:''};
function calcTargets(){
  const groups={};S.receipts.forEach(r=>{const k=gkey(r);(groups[k]=groups[k]||[]).push(r)});

  sel.value=groups[cur]?cur:'';C.target=sel.value;

function calcNums(){const p=+C.val||0,r=C.rate;let tax,ex,inc;if(C.tax==='in'){tax=p*r/(100+r);ex=p-tax;inc=p}else{tax=p*r/100;ex=p;inc=p+tax}return{p,tax,ex,inc}}
const CIRC=2*Math.PI*32;
function calcRender(){
  const n=calcNums();
  $('#cVal').textContent=fmt(n.p);$('#dispLbl').textContent=C.tax==='in'?'含稅價':'未稅價';
  countUp($('#cRefund'),n.tax,'¥');
  const t=$('#cTwd');if(S.fx){countUp(t,n.tax*S.fx.rate,'NT$')}else t.textContent='—';
  const box=$('#ringBox'),add=$('#cAdd');
  if(!C.target){box.hidden=true;add.textContent=n.p?'存成新收據':'先輸入價格';add.disabled=!n.p;return}
  box.hidden=false;
  const base=groupExcl(C.target),tot=base+n.ex,need=Math.max(0,5000-tot);
  const pb=Math.min(1,base/5000),pt=Math.min(1,tot/5000);
  $('#rBase').style.strokeDasharray=CIRC;$('#rAdd').style.strokeDasharray=CIRC;
  $('#rBase').style.strokeDashoffset=CIRC*(1-pb);$('#rAdd').style.strokeDashoffset=CIRC*(1-pt);
  countUp($('#rPct'),Math.round(pt*100),'','%');
  $('#rTxt').innerHTML=need>0?`未稅還差 <span class="num">${yen(need)}</span>`:'已到 ¥5,000 門檻';
  $('#rSub').innerHTML=`<span><span class="dot-l" style="--c:var(--blue-mid)"></span>已買 ${yen(base)}</span>${n.p?`<span><span class="dot-l" style="--c:var(--sand-mid)"></span>這筆 ${yen(n.ex)}</span>`:''}`;
  add.textContent=n.p?'加購：加進這家':'先輸入價格';add.disabled=!n.p;
}

const LIQ=/化妝水|化粧水|乳液|卸妝|精華|洗髮|潤髮|沐浴|噴霧|香水|飲料|酒|醬|油|凝膠|液|ローション|スプレー|ミスト|オイル/;
function renderPack(){
  let carry=0,check=0;const W=$('#pkList');
  if(!S.receipts.length){W.innerHTML='<div class="empty" style="margin-top:14px">先新增收據，品項會出現在這裡</div>';countUp($('#pkCarry'),0);countUp($('#pkCheck'),0);return}
  W.innerHTML=S.receipts.map(r=>{
    const gone=r.items.filter(it=>it.gone);
    const rows=r.items.map((it,i)=>{if(it.gone)return'';
      if(it.liquid===undefined)it.liquid=LIQ.test(it.name);const pack=it.pack||'carry';const q=+it.qty||1;pack==='carry'?carry+=q:check+=q;
      return `<div class="pk ${pack==='check'?'bad':''}" data-r="${r.id}" data-i="${i}">
        <div class="pk-row"><div class="pk-name">${esc(it.name)||'未命名'}</div><div class="seg"><span class="knob"></span><button data-v="carry" aria-pressed="${pack==='carry'}">隨身</button><button data-v="check" aria-pressed="${pack==='check'}">託運</button></div></div>
        <div class="pk-row2"><div class="pk-meta">×${q}${it.type==='c'?'・別用掉':''}</div><button class="tog" data-t="liquid" aria-pressed="${!!it.liquid}">${I.drop}液體／噴霧</button></div>
        ${pack==='check'?`<div class="pk-warn">${I.warn}<span>先過海關才能託運</span><button class="btn ghost" data-fix>改放隨身</button></div>`:''}
        ${it.liquid&&pack==='carry'?`<div class="pk-tip">隨身液體每瓶 100ml 以下；超過的，過海關後再託運</div>`:''}</div>`}).join('');
    return `<div class="pk-group"><h3>${esc(r.store)}・${md(r.date)}</h3>${rows}${gone.length?`<div class="pk-gone">${I.warn}已用掉：${gone.map(g=>esc(g.name)).join('、')}（不用打包，出境找海關櫃台說明）</div>`:''}</div>`}).join('');

function compress(file,M=1000,q=.68){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=url})}

function loadTesseract(){return window.Tesseract?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('net'));document.head.appendChild(s)})}
function ocrBar(html){const b=$('#ocrBar');b.hidden=false;b.innerHTML=html}
async function runOCR(file){
  if(!E)return;
  try{E.photo=await compress(file);showPhoto()}catch(e){toast('讀不到這張照片');return}
  if(!navigator.onLine){ocrBar('<b>沒有網路，無法自動辨識</b>照片已存，請手動填。');return}
  ocrBar('<b>載入辨識工具…</b>第一次要下載約幾 MB<div class="track"><div class="fill" id="ocrFill" style="width:5%"></div></div>');
  try{
    await loadTesseract();
    const big=await compress(file,1800,.9);
    const res=await Tesseract.recognize(big,'jpn+eng',{logger:m=>{if(m.status==='recognizing text'){const f=$('#ocrFill');if(f)f.style.width=(10+m.progress*90)+'%';const b=$('#ocrBar b');if(b)b.textContent=`辨識中 ${Math.round(m.progress*100)}%`}}});
    window.__lastOCR=res.data.text;
    applyOCR(parseReceipt(res.data.text));
  }catch(e){ocrBar('<b>自動辨識失敗</b>需要連網；照片已存，請手動填。')}
}
['#ocrCam','#ocrFile'].forEach(s=>$(s).onchange=e=>{const f=e.target.files[0];if(f)runOCR(f);e.target.value=''});
const Z=s=>s.replace(/[０-９Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/￥/g,'¥').replace(/，/g,',').replace(/．/g,'.');
const CJK='\u3040-\u30ff\u3400-\u9fff\uff66-\uff9f';
function parseReceipt(text){
  const lines=Z(text).split(/\n/).map(l=>l.replace(new RegExp(`([${CJK}])\\s+(?=[${CJK}])`,'g'),'$1').replace(/\s+/g,' ').trim()).filter(l=>l.length>1);
  const out={store:'',date:'',total:0,items:[]};
  for(const l of lines){const m=l.match(/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/);if(m){out.date=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;break}}
  const money=l=>{const m=l.match(/[¥\\]?\s*(\d{1,3}(?:[,.]\d{3})+|\d{2,7})\s*[※*軽]?\s*$/);return m?+m[1].replace(/[,.]/g,''):0};
  const tl=lines.find(l=>/(合計|総合計|お買上|総額|TOTAL)/i.test(l)&&!/小計/.test(l)&&money(l));if(tl)out.total=money(tl);
  const skip=/(小計|合計|計|税|対象|預|釣|現金|クレジット|カード|点数|TEL|電話|レジ|担当|No\.|領収|免税|TAX|お買上|割引|値引)/i;
  const dateish=/(20\d{2}\s*[年\/.\-])|(\d{1,2}:\d{2})/;
  for(const l of lines){if(skip.test(l)||dateish.test(l))continue;const p=money(l);if(!p||p>2000000)continue;
    const name=l.replace(/[¥\\]?\s*(\d{1,3}(?:[,.]\d{3})+|\d{2,7})\s*[※*軽]?\s*$/,'').replace(/^[\s*※・\-]+/,'').trim();
    if(name.length<2||!new RegExp(`[${CJK}A-Za-z]`).test(name))continue;out.items.push({name,price:p})}
  const head=lines.slice(0,5).filter(l=>!/(TEL|電話|領収|レシート|レジ|担当|No\.|^[\d\s\-:()]+$)/i.test(l)&&!dateish.test(l)&&new RegExp(`[${CJK}A-Za-z]`).test(l)&&!money(l));
  out.store=(head[0]||'');if(head[1]&&!/店/.test(out.store)&&/店$/.test(head[1]))out.store+=' '+head[1];out.store=out.store.slice(0,30);
  return out;
}
function markAuto(f){$('#atStore').hidden=!f.store;$('#atDate').hidden=!f.date;$('#fStore').classList.toggle('auto',!!f.store);$('#fDate').classList.toggle('auto',!!f.date)}
function applyOCR(o){
  const got=[];
  if(o.store){E.store=o.store;$('#fStore').value=o.store;got.push('店名')}
  if(o.date){E.date=o.date;$('#fDate').value=o.date;got.push('日期')}
  if(o.items.length){E.items=o.items.map(x=>({name:x.name,type:'g',food:false,qty:1,price:String(x.price),gone:false,auto:true}));got.push(`${o.items.length} 個品項`)}
  else if(o.total){E.items=[{name:'收據合計',type:'g',food:false,qty:1,price:String(o.total),gone:false,auto:true}];got.push('合計')}
  markAuto({store:!!o.store,date:!!o.date});renderItems();
  const sum=rTotal(E);let chk='';
  if(o.total)chk=Math.abs(sum-o.total)<1?`收據合計 ${yen(o.total)}，和品項加總一致`:`收據合計 ${yen(o.total)}，品項加總 ${yen(sum)}，<b style="display:inline">不一致，請檢查</b>`;
  ocrBar(got.length?`<b>自動辨識・請確認</b>讀到：${got.join('、')}。${chk?'<br>'+chk:''}<br>食品・化妝品和 8% 請自己點選。`:'<b>沒讀到可用的內容</b>照片已存，請手動填。');
}

function confetti(){
  if(reduce)return;const c=$('#conf');c.hidden=false;const x=c.getContext('2d'),dpr=devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  const cols=['#7D8DA0','#B08F5E','#E2B9B5'];
  const P=Array.from({length:40},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(t-t0<1200)requestAnimationFrame(f);else{x.clearRect(0,0,innerWidth,innerHeight);c.hidden=true}})(t0);
}

const bigAp=x=>x&&(x.g==='m'||x.id==='HND-T2');
const sugEarly=()=>{const x=apGet(S.airport);return x?(bigAp(x)?180:150):180};
function fl(){S.flt=Object.assign({time:'',travel:60,early:null},S.flt||{});return S.flt}
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function timeline(){const f=fl();if(!S.dep||!f.time)return null;const T0=new Date(S.dep+'T'+f.time+':00');if(isNaN(T0))return null;
  const early=f.early??sugEarly(),M=60e3,arrive=new Date(T0-early*M),gate=new Date(T0-40*M);
  let ck=new Date(+arrive+30*M),sec=new Date(+arrive+60*M);
  if(sec>gate-10*M){const span=gate-arrive;ck=new Date(+arrive+span*.3);sec=new Date(+arrive+span*.6)}
  return{T0,early,steps:[['出門',new Date(arrive-f.travel*M),`到機場約 ${f.travel} 分鐘`],['到機場',arrive,''],['海關退稅確認',arrive,'先辦這個，託運之前','hot'],['報到、託運',ck,'確認完才能託運'],['安檢、出境審查',sec,''],['到登機口',gate,'起飛前 40 分鐘（我們的建議）'],['起飛',T0,'']]}}
let tickH=0;
function tick(){clearInterval(tickH);const run=()=>{const L=$('#live');if(!L||!T||T.name!=='time'){clearInterval(tickH);return}const tl=timeline();if(!tl){L.hidden=true;return}
  const now=new Date(),nx=tl.steps.find(s=>s[1]>now);
  $$('#tline li').forEach((li,i)=>{const t=tl.steps[i][1];li.classList.toggle('past',t<=now&&tl.steps[i]!==nx);li.classList.toggle('now',tl.steps[i]===nx)});
  if(!nx){L.hidden=false;L.innerHTML='<b>已經起飛了</b>';return}
  const ms=nx[1]-now;if(ms>24*3600e3){L.hidden=true;return}
  const s=Math.floor(ms/1e3),p=n=>String(n).padStart(2,'0');L.hidden=false;
  L.innerHTML=`<div class="small" style="font-weight:700">下一步：${esc(nx[0])}（${hm(nx[1])}）</div><div class="big2">${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}</div><div class="small">當天才會顯示倒數</div>`};
  run();tickH=setInterval(run,1000)}

function timeICS(){const tl=timeline();if(!tl)return;const z=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;

  const st=tl.steps,ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//jtf//timeline//ZH',...ev('leave',st[0][1],st[1][1],'出門去機場（退稅品帶在身上）',15),...ev('customs',st[2][1],st[3][1],'到機場：先辦海關退稅確認，再託運',0),'END:VCALENDAR'].join('\r\n');

const b64u=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
async function pack(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){const s=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64u(await new Response(s).arrayBuffer())}
  return 'j'+b64u(raw)}
async function unpack(str){const k=str[0],a=ub64u(str.slice(1));let bytes=a;
  if(k==='z'){if(!window.DecompressionStream)throw new Error('nods');const s=new Blob([a]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(s).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(bytes))}

function shopCalc(){const L=S.shop||[];let inc=0,tax=0,miss=0;L.forEach(it=>{if(it.price===''||it.price==null){miss++;return}const p=(+it.price||0)*(+it.qty||1),r=it.food?8:10;inc+=p;tax+=p*r/(100+r)});return{inc,tax,ex:inc-tax,miss}}

  <div class="small" style="font-weight:700;color:${gap?'var(--warn)':'var(--ok)'}">${gap?`離同店同日 ¥5,000（未稅）還差 ${yen(gap)}`:'已達同店同日 ¥5,000 門檻'}</div>${c.miss?`<div class="small muted">${c.miss} 樣還沒填價格，沒算進去</div>`:''}`}

function toolClick(b){const d=b.dataset;
  if(T.name==='map')return mapClick(b);if(T.name==='fx')return fxClick(b);if(T.name==='spend')return spendClick(b);
  if(T.name==='time'){const f=fl();
    if(d.t==='ap')return openApk(S.airport?'list':undefined);
    if(d.t==='tr-'||d.t==='tr+'){buzz();f.travel=Math.max(10,Math.min(300,f.travel+(d.t==='tr+'?10:-10)));save();return tlRender(true)}
    if(d.t==='ea-'||d.t==='ea+'){buzz();f.early=Math.max(60,Math.min(300,(f.early??sugEarly())+(d.t==='ea+'?15:-15)));save();return tlRender(true)}
    if(d.t==='ea0'){f.early=null;save();return tlRender(true)}
    if(d.t==='ics')return timeICS();}
  if(T.name==='share'){if(d.s==='copy')copyText(T.url).then(o=>toast(o?'已複製連結':'複製失敗，請長按連結'));if(d.s==='native')navigator.share({title:'退稅收據',url:T.url}).catch(()=>{});return}
  if(T.name==='import'){if(d.i==='mate')return doImport(true);if(d.i==='merge')return doImport(false);if(d.i==='cancel'){IMP=null;return closeTool()}}
  if(T.name==='shop'){const L=S.shop;
    if(d.add){buzz();const c=catGet(d.add),ex=L.find(x=>x.pid===c[0]);if(ex)ex.qty++;else L.push({pid:c[0],name:c[1]+(c[3]?' '+c[3]:''),price:c[4],qty:1,food:!!c[5]});save();toast('已加入：'+c[1]);return tlRender(true)}
    if(d.q!==undefined){buzz();const it=L[+d.q];it.qty=Math.max(1,it.qty+(+d.d));save();return tlRender(true)}
    if(d.rm!==undefined){L.splice(+d.rm,1);save();return tlRender(true)}
    if(d.sh==='cadd'){const el=$('[data-sh="cname"]'),n=el.value.trim();if(!n){toast('先填名稱');return}L.push({pid:'',name:n.slice(0,40),price:null,qty:1,food:false});save();return tlRender(true)}
    if(d.sh==='clear'){if(!confirm('清空購物清單？'))return;S.shop=[];save();return tlRender(true)}
    if(d.sh==='toR'){const st=(T.store||'').trim();if(!st){toast('先填店名');$('[data-sh="store"]').focus();return}
      const items=L.filter(it=>it.price!==''&&it.price!=null);if(!items.length){toast('先填價格');return}
      S.receipts.push({id:uid(),store:st,date:today(),photo:null,items:items.map(it=>({name:it.name,type:'c',food:!!it.food,qty:it.qty,price:+it.price}))});
      if(!save())return;const left=L.length-items.length;S.shop=L.filter(it=>!(it.price!==''&&it.price!=null));save();toast(`已轉成收據${left?`（${left} 樣沒價格，留在清單）`:''}`);return tlRender(true)}
  }}
function toolChange(el){const d=el.dataset;
  if(T.name==='spend')return spendInput(el);
  if(T.name==='time'){if(d.t==='dep'){S.dep=el.value;save();syncSW()}if(d.t==='time'){fl().time=el.value;save()}return tlRender(true)}
  if(T.name==='share'&&d.s==='me'){S.me=el.value.trim().slice(0,12);save();shareBuild();return}
  if(T.name==='shop'&&d.pr!==undefined){const v=el.value.replace(/[^\d]/g,'');S.shop[+d.pr].price=v===''?null:+v;save();$('#slSum').innerHTML=shopSum();return}}
function toolInput(el){if(!T)return;const d=el.dataset;
  if(T.name==='spend')return spendInput(el);
  if(T.name==='import'&&d.i==='name')IMP.name=el.value;
  if(T.name==='shop'&&d.sh==='store')T.store=el.value;
  if(T.name==='shop'&&d.pr!==undefined){const v=el.value.replace(/[^\d]/g,'');S.shop[+d.pr].price=v===''?null:+v;$('#slSum').innerHTML=shopSum()}}

    try{const res=await fetchT(ep,ms,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(ovQ(lat,lon,r))});
      if(!res.ok){last=new Error('http '+res.status);await new Promise(z=>setTimeout(z,1500));continue}const j=await res.json();if(!j||!Array.isArray(j.elements)){last=new Error('bad');continue}
